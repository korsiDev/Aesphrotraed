name: Aesphrotraed
description: $description
prefix: AES
version: '${version}'

main: me.korsidev.aesphrotraed.Aesphrotraed
api-version: '26.2'
load: POSTWORLD

authors: [ korsiDev ]

depend: [LuckPerms]

commands:
  setTitle:
    description: ''
  serverTitles:
    permission: aesphrotraed.serverTitles
  economy:
    permission: aesphrotraed.economy

  friends:
    aliases: [ friend, f ]

  pay:
    description: Give away some money

  purse:
    aliases: [balance, bal, b]
    description: Look at your purse

  admin:
    permission: aesphrotraed.admin