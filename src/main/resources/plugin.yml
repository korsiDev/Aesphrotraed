name: Aesphrotraed
description: $description
prefix: AES
version: '${version}'

main: me.korsidev.aesphrotraed.Aesphrotraed
api-version: '26.2'
load: POSTWORLD

authors: [ korsiDev ]

depend: [LuckPerms]

permissions:
  aesphrotraed.admin:
    description: Access to Aesphrotraed administrative commands
    default: op

commands:
  setTitle:
    description: ''

  friends:
    aliases: [ friend, f ]

  pay:
    description: Give away some money

  purse:
    aliases: [balance, bal, b]
    description: Look at your purse

  admin:
    permission: aesphrotraed.admin

  profile:
    description: Open your Profile GUI.